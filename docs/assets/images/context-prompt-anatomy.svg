<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a context-rich prompt</title>
  <desc id="desc">A diagram showing that a strong prompt combines an instruction, task context, evidence, constraints, and an output format.</desc>
  <rect width="1200" height="520" fill="#f8faf8"/>
  <rect x="56" y="54" width="1088" height="412" rx="16" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.24" stroke-width="2"/>
  <text x="96" y="118" fill="#10201d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Anatomy of a Context-Rich Prompt</text>
  <text x="96" y="158" fill="#39524d" font-family="Arial, sans-serif" font-size="19">Keep the main task visible, then add only the facts and rules needed for this answer.</text>

  <g transform="translate(96 218)">
    <rect width="176" height="138" rx="10" fill="#0f766e"/>
    <text x="24" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Instruction</text>
    <text x="24" y="78" fill="#e6fffb" font-family="Arial, sans-serif" font-size="16">What should</text>
    <text x="24" y="102" fill="#e6fffb" font-family="Arial, sans-serif" font-size="16">the model do?</text>
  </g>

  <g transform="translate(306 218)">
    <rect width="176" height="138" rx="10" fill="#f59e0b"/>
    <text x="24" y="42" fill="#10201d" font-family="Arial, sans-serif" font-size="24" font-weight="700">Context</text>
    <text x="24" y="78" fill="#10201d" font-family="Arial, sans-serif" font-size="16">What situation</text>
    <text x="24" y="102" fill="#10201d" font-family="Arial, sans-serif" font-size="16">does it need?</text>
  </g>

  <g transform="translate(516 218)">
    <rect width="176" height="138" rx="10" fill="#2563eb"/>
    <text x="24" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Evidence</text>
    <text x="24" y="78" fill="#eff6ff" font-family="Arial, sans-serif" font-size="16">Which sources</text>
    <text x="24" y="102" fill="#eff6ff" font-family="Arial, sans-serif" font-size="16">support it?</text>
  </g>

  <g transform="translate(726 218)">
    <rect width="176" height="138" rx="10" fill="#7c3aed"/>
    <text x="24" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Constraints</text>
    <text x="24" y="78" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="16">What rules and</text>
    <text x="24" y="102" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="16">limits apply?</text>
  </g>

  <g transform="translate(936 218)">
    <rect width="176" height="138" rx="10" fill="#334155"/>
    <text x="24" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Format</text>
    <text x="24" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16">How should the</text>
    <text x="24" y="102" fill="#f8fafc" font-family="Arial, sans-serif" font-size="16">answer look?</text>
  </g>

  <path d="M272 287h34" stroke="#78948f" stroke-width="5" stroke-linecap="round"/>
  <path d="M482 287h34" stroke="#78948f" stroke-width="5" stroke-linecap="round"/>
  <path d="M692 287h34" stroke="#78948f" stroke-width="5" stroke-linecap="round"/>
  <path d="M902 287h34" stroke="#78948f" stroke-width="5" stroke-linecap="round"/>

  <text x="96" y="418" fill="#39524d" font-family="Arial, sans-serif" font-size="18">Rule of thumb: if a detail does not change the answer, remove it.</text>
</svg>
